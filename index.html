<!DOCTYPE html>
<html lang="fr">

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link

      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="background-blobs" aria-hidden="true">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>

    <main class="main-wrapper">
      <article class="card">
        <div class="card-content">
          <div class="profile-wrapper">
            <div class="profile-container organic-shape">
              <img
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuANbGFhn5K7mGCsI0jo_BPIv_2r9Dt2CAoKhXzBky8MuKNsurv8bbQubu8cwLy-RW9Iv6aEv8e3o4nwByWUgnxAUyhO9lI8DWy1i7JZbJDpXYbyR8HHRu4Dkqcxxwh2aElISgG2B2RiUPpzVR_3C_cA899t4UYlUyMTUgkep9D2WkbcbqptSlyoFSVk8MMJukn7BLHvNndOBV8V4-BWMIScYVJnVIklccTBlnRho4tnzTo6j3N8b_amAnCvJ1SxGkKy74MgLx_1hpc"

                class="profile-img organic-shape"
                loading="eager"
              />
              <div class="profile-border-hover organic-shape"></div>
              <div class="profile-glow"></div>
            </div>
          </div>

          <section class="text-content">
            <header>
              <h1>Bonjour, je suis Baptiste Marcon</h1>
              <h2>Développeur Front-End (React / Next.js)</h2>
              <p class="bio">
                Je transforme des idées complexes en interfaces fluides et
                intuitives.
              </p>
            </header>

            <nav class="buttons-group" aria-label="Réseaux sociaux et CV">
              <a
                class="btn btn-glass"
                href="https://github.com/baptistemcn"
                target="_blank"
                rel="noopener noreferrer"
              >
                <span class="material-symbols-outlined" aria-hidden="true"
                  >code</span
                >
                <span>GitHub</span>
              </a>
              <a
                class="btn btn-glass"
                href="https://www.linkedin.com/in/baptiste-marcon/"
                target="_blank"
                rel="noopener noreferrer"
              >
                <span class="material-symbols-outlined" aria-hidden="true"
                  >group</span
                >
                <span>LinkedIn</span>
              </a>
              <a class="btn btn-primary" href="/cv.pdf" download>
                <span class="material-symbols-outlined" aria-hidden="true"
                  >description</span
                >
                <span>Mon CV</span>
              </a>

        </div>

    <footer class="site-footer">
      <p>© 2024 Baptiste Marcon. Tous droits réservés.</p>
