<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio de Baptiste Marcon, Développeur Front-End React & Next.js."
    />
    <title>Baptiste Marcon - Développeur React</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />

    <script src="js/app.js" type="module" defer></script>
  </head>
  <body>
    <div class="background-blobs" aria-hidden="true">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>

    <main class="main-wrapper">
      <article class="card">
        <div class="card-content">
          <div class="profile-wrapper">
            <div class="profile-container organic-shape">
              <img
                src="assets/Baptiste Marcon.jpg"
                alt="Portrait de Baptiste Marcon"
                class="profile-img organic-shape"
                loading="eager"
              />
              <div class="profile-border-hover organic-shape"></div>
              <div class="profile-glow"></div>
            </div>
          </div>

          <section class="text-content">
            <header>
              <h1>Bonjour, je suis Baptiste Marcon</h1>
              <h2>Développeur Front-End (React / Next.js)</h2>
              <p class="bio">
                Je transforme des idées complexes en interfaces fluides et
                intuitives.
              </p>
            </header>

            <nav class="buttons-group" aria-label="Réseaux sociaux et CV">
              <bmarcon-btn
                href="https://github.com/baptistemcn"
                variant="glass"
                icon="code"
                target="_blank"
              >
                GitHub
              </bmarcon-btn>
              <bmarcon-btn
                href="https://www.linkedin.com/in/baptiste-marcon/"
                variant="glass"
                icon="group"
                target="_blank"
              >
                LinkedIn
              </bmarcon-btn>

              <bmarcon-btn
                href="/cv.pdf"
                variant="primary"
                icon="description"
                target="_blank"
                download
              >
                Mon CV
              </bmarcon-btn>
            </nav>
          </section>
        </div>
      </article>
    </main>

    <footer class="site-footer">
      <p>© 2025 Baptiste Marcon. Tous droits réservés.</p>
    </footer>
  </body>
</html>
